services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antifox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-antifox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antifox} -d ${POSTGRES_DB:-antifox}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  antifox:
    image: ghcr.io/antifox-ai/antifox:${ANTIFOX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANTIFOX_PG_DSN: postgres://${POSTGRES_USER:-antifox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-antifox}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTIFOX_LLM_PROVIDER: ${ANTIFOX_LLM_PROVIDER:-}
      ANTIFOX_LLM_MODEL: ${ANTIFOX_LLM_MODEL:-}
      ANTIFOX_LLM_BASE_URL: ${ANTIFOX_LLM_BASE_URL:-}
      ANTIFOX_LLM_PROXY: ${ANTIFOX_LLM_PROXY:-}
    ports:
      - "8787:8787"
      # The traffic proxy (8788) is bound only to the container's loopback by default and is not published — it has no client authentication, so exposing it to the public internet would let it be abused as an open proxy. Only publish it for remote use after adding authentication + network isolation yourself.
    volumes:
      # Bind the data directory (including jwt.key, SQLite, etc.) to data/ at the project root,
      # so you can inspect/back it up directly on the host, and it survives container rebuilds.
      - ./data:/app/data
      # Mount the skills directory from the project root into the container (overriding the image's built-in /app/skills);
      # editing a skill needs no image rebuild — the container reads this copy from the host.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
